name: Release Waggy

on:
  push:
    branches:
      - main

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}
  WHATS_NEW: Исправления ошибок и улучшения

permissions:
  contents: read

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  build:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate automatic version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Automatic releases must run from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version_name must use semantic versioning, for example 1.2.0 or 1.2.0-beta.1."
            exit 1
          fi

          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer."
            exit 1
          fi

          if (( ${#VERSION_CODE} > 10 )) || (( 10#$VERSION_CODE > 2100000000 )); then
            echo "::error::version_code must not exceed 2100000000."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v$VERSION_NAME"; then
            echo "::error::Tag v$VERSION_NAME already exists."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare private build files
        env:
          BASE64_ENV: ${{ secrets.BASE64_SECRET }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for secret_name in \
            ALIAS \
            GOOGLE_SERVICES_JSON_BASE64 \
            KEY_PASSWORD \
            KEY_STORE_PASSWORD \
            SIGNING_KEY
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required repository secret $secret_name is not configured."
              missing=1
            fi
          done
          if (( missing != 0 )); then
            exit 1
          fi

          umask 077
          signing_dir="$RUNNER_TEMP/waggy-signing"
          mkdir -p "$signing_dir"

          printf '%s' "$SIGNING_KEY" | base64 --decode > "$signing_dir/release.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

          if [[ -n "${BASE64_ENV:-}" ]]; then
            printf '%s' "$BASE64_ENV" | base64 --decode > .env
          else
            cp .env.example .env
          fi

      - name: Test, lint, and build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/waggy-signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebug lintDebug assembleRelease bundleRelease --no-daemon

      - name: Remove private build files
        if: always()
        shell: bash
        run: |
          rm -f app/google-services.json .env
          rm -f "$RUNNER_TEMP/waggy-signing/release.jks"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          install -m 0644 \
            app/build/outputs/apk/release/app-release.apk \
            "dist/Waggy-$VERSION_NAME.apk"
          install -m 0644 \
            app/build/outputs/bundle/release/app-release.aab \
            "dist/Waggy-$VERSION_NAME.aab"
          (
            cd dist
            sha256sum "Waggy-$VERSION_NAME.apk" "Waggy-$VERSION_NAME.aab" > SHA256SUMS.txt
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Waggy-${{ env.VERSION_NAME }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  rustore:
    name: Upload RuStore draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: Waggy-${{ env.VERSION_NAME }}
          path: dist

      - name: Validate RuStore secrets
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$RUSTORE_KEY_ID" || -z "$RUSTORE_PRIVATE_KEY" ]]; then
            echo "::error::RUSTORE_KEY_ID and RUSTORE_PRIVATE_KEY secrets are required."
            exit 1
          fi

      - name: Upload to RuStore
        uses: suro4ek/rustore-action@ea9bcd5d56c52bbe47448605e741375c6e7884ab # v0.0.1
        with:
          key_id: ${{ secrets.RUSTORE_KEY_ID }}
          private_key: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          application_id: ru.bitvibe.waggy
          file: dist/Waggy-${{ env.VERSION_NAME }}.aab
          whats_new: ${{ env.WHATS_NEW }}

  github-release:
    name: Publish GitHub release
    needs:
      - build
      - rustore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: Waggy-${{ env.VERSION_NAME }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_args=(
            "v$VERSION_NAME"
            dist/*
            --target "$GITHUB_SHA"
            --title "Waggy $VERSION_NAME"
            --generate-notes
          )

          gh release create "${release_args[@]}"
