# ─── Gradle daemon ────────────────────────────────────────────────────────────
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2g \
  -XX:+UseG1GC \
  -XX:MaxMetaspaceSize=512m \
  -XX:SoftRefLRUPolicyMSPerMB=0 \
  -XX:+HeapDumpOnOutOfMemoryError \
  -Dfile.encoding=UTF-8
# ─── Build parallelism & caching ──────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ─── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true
# ─── KSP (replaces KAPT — already using it) ───────────────────────────────────
ksp.incremental=true
ksp.incremental.intermodule=true
# ─── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
# No legacy support-lib deps → skip Jetifier entirely
android.enableJetifier=false
# Moved from build.gradle (previous review)
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
# Disable all unused build features globally;
# override per-module with buildFeatures { } only where needed
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false